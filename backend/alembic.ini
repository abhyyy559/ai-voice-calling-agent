# Alembic configuration — backend database migrations.
#
# The sqlalchemy.url is resolved at runtime by migrations/env.py in this
# order: DATABASE_URL environment variable -> app Settings (.env) -> empty
# here. Run from backend/:  alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# populated by env.py from the environment / app settings
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
